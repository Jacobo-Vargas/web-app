name: Build and Deploy web-app to EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FINERACT_API_URL: ${{ secrets.FINERACT_API_URL }}
      FINERACT_PLATFORM_TENANT_IDENTIFIER: ${{ secrets.FINERACT_PLATFORM_TENANT_IDENTIFIER }}
      MIFOS_DEFAULT_LANGUAGE: ${{ secrets.MIFOS_DEFAULT_LANGUAGE }}
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.9.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t web-app:latest .

      - name: Tag image for ECR
        run: |
          docker tag web-app:latest ${{ secrets.ECR_REPOSITORY }}:latest

      - name: Push image to ECR
        run: |
          docker push ${{ secrets.ECR_REPOSITORY }}:latest

      - name: Set up SSH access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -ex

            # Login a ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY }}

            # Detener y remover contenedor previo
            docker stop web-app || true
            docker rm web-app || true

            # Obtener la nueva imagen
            docker pull ${{ secrets.ECR_REPOSITORY }}:latest

            # Ejecutar el contenedor con los secrets
            docker run -d --name web-app -p 80:80 \
              -e FINERACT_API_URL="${{ secrets.FINERACT_API_URL }}" \
              -e FINERACT_PLATFORM_TENANT_IDENTIFIER="${{ secrets.FINERACT_PLATFORM_TENANT_IDENTIFIER }}" \
              -e MIFOS_DEFAULT_LANGUAGE="${{ secrets.MIFOS_DEFAULT_LANGUAGE }}" \
              ${{ secrets.ECR_REPOSITORY }}:latest

            docker logs --tail 50 web-app
          EOF
